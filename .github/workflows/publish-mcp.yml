name: Publish MCP

on:
  workflow_dispatch:
  # Disabled while the MCP is unused; restore to publish on push again.
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "apps/mcp/**"

env:
  HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0

      - name: Build
        run: pnpm --filter @motormetrics/mcp build

      - name: Publish
        run: pnpm --filter @motormetrics/mcp publish --provenance --access public --no-git-checks
